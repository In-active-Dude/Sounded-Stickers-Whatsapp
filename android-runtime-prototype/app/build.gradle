plugins { id 'com.android.application' }
android {
    namespace 'com.soundsticker.runtimecheck'
    compileSdk 35
    ndkVersion '27.2.12479018'
    defaultConfig {
        applicationId 'com.soundsticker.runtimecheck'
        minSdk 29
        targetSdk 35
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild { cmake { arguments '-DANDROID_STL=c++_shared' } }
    }
    externalNativeBuild { cmake { path 'CMakeLists.txt'; version '3.22.1' } }
    sourceSets { main { jniLibs.srcDirs = ['libnode/bin'] } }
    packaging { jniLibs { useLegacyPackaging = true; pickFirsts += ['**/libc++_shared.so'] } }
}
dependencies {
    implementation 'dev.ffmpegkit-maintained:ffmpeg-kit-full:8.1.9'
    implementation 'com.arthenica:smart-exception-java:0.2.1'
}
